name: B4.3A font lock update

on:
  push:
    branches:
      - feature/foco-premium-foundation-b4-3a
    paths:
      - .github/workflows/b4-3a-font-lock.yml

permissions:
  contents: write

jobs:
  update-font-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/foco-premium-foundation-b4-3a
          fetch-depth: 0

      - name: Patch Instrument Sans dependency deterministically
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkgPath = 'package.json';
          const lockPath = 'package-lock.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const name = '@expo-google-fonts/instrument-sans';
          pkg.dependencies[name] = '^0.4.2';
          lock.packages[''].dependencies[name] = '^0.4.2';
          lock.packages['node_modules/@expo-google-fonts/instrument-sans'] = {
            version: '0.4.2',
            resolved: 'https://registry.npmjs.org/@expo-google-fonts/instrument-sans/-/instrument-sans-0.4.2.tgz',
            integrity: 'sha512-YR0jemCJ/eUlknOfxxxiLnJWpFDaT0KgLiB1q333jIDPlRAERfuMpOislkWA1A7HGX85N9LCsjWLlB3QOZo1wg==',
            license: 'MIT AND OFL-1.1'
          };
          const sortObject = (value) => Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b)));
          pkg.dependencies = sortObject(pkg.dependencies);
          lock.packages[''].dependencies = sortObject(lock.packages[''].dependencies);
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit lock update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: lock Instrument Sans for B4.3A"
          git push origin HEAD:feature/foco-premium-foundation-b4-3a
