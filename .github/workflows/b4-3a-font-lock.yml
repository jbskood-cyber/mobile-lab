name: B4.3A font lock cleanup

on:
  push:
    branches:
      - feature/foco-premium-foundation-b4-3a
    paths:
      - .github/workflows/b4-3a-font-lock.yml

permissions:
  contents: write

jobs:
  update-font-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/foco-premium-foundation-b4-3a
          fetch-depth: 0

      - name: Remove legacy Manrope dependency deterministically
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkgPath = 'package.json';
          const lockPath = 'package-lock.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const oldName = '@expo-google-fonts/manrope';
          const newName = '@expo-google-fonts/instrument-sans';
          pkg.dependencies[newName] = '^0.4.2';
          lock.packages[''].dependencies[newName] = '^0.4.2';
          delete pkg.dependencies[oldName];
          delete lock.packages[''].dependencies[oldName];
          delete lock.packages[`node_modules/${oldName}`];
          const sortObject = (value) => Object.fromEntries(Object.entries(value).sort(([a], [b]) => a.localeCompare(b)));
          pkg.dependencies = sortObject(pkg.dependencies);
          lock.packages[''].dependencies = sortObject(lock.packages[''].dependencies);
          fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

      - name: Commit lock cleanup
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remove Manrope after Instrument Sans migration"
          git push origin HEAD:feature/foco-premium-foundation-b4-3a
