name: B4.3A motion dependency lock final

on:
  push:
    branches:
      - feature/foco-premium-foundation-b4-3a
    paths:
      - .github/workflows/b4-3a-motion-deps.yml

permissions:
  contents: write

jobs:
  lock-motion-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/foco-premium-foundation-b4-3a
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked baseline
        run: npm ci --no-audit --no-fund

      - name: Resolve Expo SDK compatible motion dependencies
        run: npx expo install react-native-reanimated react-native-worklets --npm

      - name: Verify dependency lock
        run: npm ci --no-audit --no-fund

      - name: Commit dependency lock
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: lock Expo-compatible motion dependencies — B4.3A"
          git push origin HEAD:feature/foco-premium-foundation-b4-3a
